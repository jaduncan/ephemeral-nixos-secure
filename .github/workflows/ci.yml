name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3

      - name: shellcheck
        run: nix run --inputs-from path:. nixpkgs#shellcheck -- -x -P SCRIPTDIR scripts/*.sh

      - name: nixfmt
        run: git ls-files -z '*.nix' | xargs -0 nix run --inputs-from path:. nixpkgs#nixfmt -- --check

      - name: Use example machine files
        run: |
          cp settings.example.nix settings.nix
          cp hardware-configuration.example.nix hardware-configuration.nix

      - name: nix flake check
        # path:. so gitignored settings/hardware are visible; --no-build = eval only (not a full Plasma closure)
        run: nix flake check path:. --no-write-lock-file --no-build
